[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chinamaxM"
version = "0.2.2"
description = "Expose non-Claude worker models as native subagents of Claude Code and Codex, routed through one local Proxy."
license = "GPL-2.0-only"
authors = [{name = "Kevin Guo"}]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "litellm[proxy]==1.96.2",
    "tomlkit>=0.13,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-aiohttp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chinamaxM = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
